# =============================================================================
#  Samba — nativ auf dem Host (/etc/samba/smb.conf)
#  Deployment: setup/06-samba-host.sh   Nutzer: scripts/nas-user.sh
# =============================================================================
#  Nutzer-Modell:
#    - Jeder NAS-Nutzer = Linux-User (ohne Login-Shell) in Gruppe nas-users
#    - Privater Ordner:  /mnt/data/shares/users/<name>   → \\nas\<name>
#    - Speicherlimit:    ext4-Kernel-Quota pro UID (setquota, via nas-user.sh)
#    - Admins (Gruppe nas-admins) dürfen zusätzlich in media/ und backups/
# =============================================================================

[global]
    workgroup = WORKGROUP
    server string = NAS Pi
    server role = standalone server
    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = file
    log level = 1

    # --- Zugriff: nur LAN + Tailscale + localhost ---
    # LAN-Subnetz bei Bedarf anpassen!
    hosts allow = 192.168.0.0/24 100.64.0.0/10 127.0.0.1
    hosts deny  = 0.0.0.0/0

    # --- Authentifizierung ---
    security = user
    passdb backend = tdbsam
    map to guest = never
    usershare allow guests = no
    restrict anonymous = 2
    server min protocol = SMB3
    disable netbios = yes
    smb ports = 445

    # --- Performance vs. Verschlüsselung ---
    # Der Pi 4 (BCM2711) hat KEINE AES-Hardwarebeschleunigung. Mit erzwungener
    # SMB3-Verschlüsselung sinkt der Durchsatz auf ca. 30–50 MB/s. Im eigenen LAN
    # bleibt sie deshalb aus (Client darf sie anfordern). Remote-Zugriff läuft
    # über Tailscale (WireGuard) bzw. Nextcloud, also trotzdem verschlüsselt.
    server smb encrypt = if_required
    server signing = default

    use sendfile = yes
    aio read size = 1
    aio write size = 1
    min receivefile size = 16384

    # Quotas an Windows/macOS melden (richtige "freier Speicher"-Anzeige)
    # dfree wird per Kernel-Quota automatisch berücksichtigt.

    # --- Kein Druckerdienst ---
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

# -----------------------------------------------------------------------------
#  Privater Ordner pro Nutzer: \\<pi>\<benutzername>
#  %S = Name des Shares = Benutzername → nur der eigene Ordner ist zugänglich
# -----------------------------------------------------------------------------
[homes]
    comment = Privater Speicher
    path = /mnt/data/shares/users/%S
    valid users = %S
    browseable = no
    read only = no
    create mask = 0600
    directory mask = 0700

# -----------------------------------------------------------------------------
#  Gemeinsamer Ordner für alle NAS-Nutzer
#  Dateien gehören dem Ersteller → zählen gegen SEINE Quota
# -----------------------------------------------------------------------------
[gemeinsam]
    comment = Gemeinsamer Ordner
    path = /mnt/data/shares/gemeinsam
    valid users = @nas-users
    read only = no
    force group = nas-users
    create mask = 0664
    directory mask = 2775

# -----------------------------------------------------------------------------
#  Medien: alle lesen, nur Admins schreiben (Jellyfin liest dieselben Dateien)
# -----------------------------------------------------------------------------
[media]
    comment = Filme, Musik, Fotos
    path = /mnt/data/shares/media
    valid users = @nas-users
    read only = yes
    write list = @nas-admins
    force group = nas-admins
    create mask = 0664
    directory mask = 2775

# -----------------------------------------------------------------------------
#  Backups: nur Admins
# -----------------------------------------------------------------------------
[backups]
    comment = Backups
    path = /mnt/data/shares/backups
    valid users = @nas-admins
    read only = no
    create mask = 0660
    directory mask = 2770
